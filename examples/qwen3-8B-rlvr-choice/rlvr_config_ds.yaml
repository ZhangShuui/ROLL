# ---------- rlvr_config_ds_lora.yaml ----------
# ① 继承 DeepSpeed 预设
defaults:
  - ../config/deepspeed_zero@_here_
  - ../config/deepspeed_zero2@_here_
  - ../config/deepspeed_zero3@_here_
  - ../config/deepspeed_zero3_cpuoffload@_here_

hydra:
  run:
    dir: .
  output_subdir: null

# ========= 基础信息 =========
exp_name: "qwen3-8B-rlvr-llmjudge-h800-8gpu"
seed: 42
logging_dir: /project/hdtaccuracy/trains/grpo/qwen3_8b_choice/logs
output_dir: /project/hdtaccuracy/trains/grpo/qwen3_8b_choice/output
num_gpus_per_node: 8      # 8×H800
# num_gpus_per_node: 4      # 2×H800

track_with: wandb
tracker_kwargs:
 api_key: dce12064d30900b2cc538f73e82997de5aafbb96
 project: roll_peralign
 notes: roll_peralign
 tags:
   - rlvr
   - baseline
  
# ========= 训练控制 =========
# max_steps: 1000
save_steps: 100
logging_steps: 1
# eval_steps: 50
resume_from_checkpoint: false

# ========= RL 超参 =========
rollout_batch_size: 32
prompt_length: 7000
response_length: 2
num_return_sequences_in_group: 8
ppo_epochs: 2
adv_estimator: "reinforce"
value_clip: 0.5
reward_clip: 10
reward_normalize: true
whiten_advantages: true

# ========= 预训练权重 =========
pretrain: /project/hdtaccuracy/models/base/Qwen3-8B
# reward_pretrain: /project/hdtaccuracy/models/base/Qwen3-8B            # critic 初始权重
validation:
  data_args:
    template: qwen3_nothinks
    file_name:
      - /project/hdtaccuracy/Personality-Alignment/choice_ver/four_choices_question_v7_hard_plus/v7_hard_val_roll.json
    max_samples: 100
  generating_args:
    do_sample: false
    max_new_tokens: 2
    num_beams: 1
    num_return_sequences: 1
  
# ========= Actor（训练） =========
actor_train:
  model_args:
    dtype: bf16
    disable_gradient_checkpointing: false
    # —— LoRA 超参 ——                                   # 可按需微调
    lora_rank: 8
    lora_target: q_proj,k_proj,v_proj,o_proj
    lora_alpha: 32
    lora_dropout: 0.05
  training_args:
    learning_rate: 1.0e-5    # LoRA 常用 1e-4–1e-3
    weight_decay: 0.0
    per_device_train_batch_size: 2   # ZeRO-3 显存足够可翻倍
    gradient_accumulation_steps: 2  # 2×16 ≈ 原来 1×32
    warmup_steps: 100
    num_train_epochs: 5
  data_args:
    template: qwen3_nothink
    file_name:
      - /project/hdtaccuracy/Personality-Alignment/choice_ver/four_choices_question_v7_hard_plus/v7_hard_train_roll.json
    dataset_dir: data
    messages: messages
    domain_interleave_probs:
      # llm_judge: 1.0
      math_rule: 1.0
  strategy_args:
    strategy_name: deepspeed_train         # ← 从 megatron_train 改成 DS
    strategy_config: ${deepspeed_zero2}    # 引用上面的 DS 预设
  device_mapping: "[0, 1, 2, 3, 4 ,5]"             # 与原先保持一致
  # device_mapping: "[0, 1]"
  # infer_batch_size: 8

# ========= Actor（推理/采样） =========
actor_infer:
  model_args:
    dtype: bf16
    disable_gradient_checkpointing: true
    lora_rank: 8
    lora_alpha: 32
    lora_dropout: 0.05
    lora_target: q_proj,k_proj,v_proj,o_proj
  generating_args:
    max_new_tokens: 2
    do_sample: false
    num_beams: 1
    num_return_sequences: ${num_return_sequences_in_group}
  data_args:
    template: qwen3_nothink
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.75
      block_size: 16
      max_model_len: 8000
  num_gpus_per_worker: 1
  device_mapping: "[6]"                     # GPU4
  # device_mapping: "[0, 1]"
  infer_batch_size: 32

# ========= Reference =========
reference:
  model_args:
    dtype: bf16
    disable_gradient_checkpointing: true
  data_args:
    template: qwen3_nothink
  strategy_args:
    strategy_name: megatron_infer
    strategy_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
  device_mapping: "[7]"                    # GPU5
  # device_mapping: "[0, 1]"
  infer_batch_size: 32

# ========= Reward =========
rewards:
  # vl pipeline support MathRuleRewardWorker only, at present.
  # Support for rewards in other domains will be retained for future implementation.
  math_rule:
    worker_cls: roll.pipeline.rlvr.rewards.math_rule_reward_worker.MathRuleRewardWorker
    model_args:
      model_name_or_path: ${pretrain}
    data_args:
      template: qwen2-vl
    strategy_args:
      strategy_name: hf_infer
      strategy_config: ~
    world_size: 8
    infer_batch_size: 16